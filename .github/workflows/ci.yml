name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Verificar sintaxis
        working-directory: backend
        run: node --check src/index.js

  build-images:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen backend
        run: docker build ./backend

      - name: Build imagen frontend
        run: docker build ./frontend

      - name: Levantar stack completo
        run: docker compose up -d --build

      - name: Esperar a que la BD esté lista
        run: |
          for i in {1..30}; do
            if docker compose exec -T db mysqladmin ping -h localhost -uroot -proot_secret --silent; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Probar healthcheck de la API
        run: |
          for i in {1..20}; do
            if curl -f http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Limpiar
        if: always()
        run: docker compose down -v
